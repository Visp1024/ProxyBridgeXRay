name: Release ProxyBridge Windows

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSYS2 (GCC)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-toolchain

    - name: Add MSYS2 to PATH
      run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: Download WinDivert
      run: |
        Invoke-WebRequest -Uri "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile "WinDivert.zip"
        Expand-Archive -Path "WinDivert.zip" -DestinationPath "C:\"
      shell: pwsh

    - name: Install NSIS
      run: choco install nsis -y
      shell: pwsh

    - name: Install NSIS EnVar plugin
      run: |
        $pluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
        Invoke-WebRequest -Uri "https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip" -OutFile "EnVar.zip"
        Expand-Archive -Path "EnVar.zip" -DestinationPath "EnVar"
        Copy-Item "EnVar\Plugins\x86-unicode\EnVar.dll" -Destination $pluginDir -Force
      shell: pwsh

    - name: Compile native DLL
      working-directory: Windows
      run: |
        $WinDivertPath = "C:\WinDivert-2.2.2-A"
        New-Item -ItemType Directory -Path output -Force | Out-Null
        $cmd = "gcc -shared -O2 -flto -s -Wall -D_WIN32_WINNT=0x0601 -DPROXYBRIDGE_EXPORTS " +
               "-I`"$WinDivertPath\include`" " +
               "src\ProxyBridge.c " +
               "-L`"$WinDivertPath\x64`" " +
               "-lWinDivert -lws2_32 -liphlpapi " +
               "-o output\ProxyBridgeCore.dll"
        cmd /c $cmd
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Copy-Item "$WinDivertPath\x64\WinDivert.dll"   output\ -Force
        Copy-Item "$WinDivertPath\x64\WinDivert64.sys" output\ -Force
      shell: pwsh

    - name: Publish GUI
      working-directory: Windows
      run: |
        dotnet publish gui/ProxyBridge.GUI.csproj -c Release -r win-x64 --self-contained `
          /p:PublishTrimmed=true `
          /p:PublishSingleFile=false `
          /p:DebugType=None `
          /p:DebugSymbols=false `
          -o gui/publish
        Copy-Item gui/publish/ProxyBridge.exe output\ -Force
        Get-ChildItem gui/publish/*.dll | Copy-Item -Destination output\ -Force
      shell: pwsh

    - name: Determine version
      id: version
      run: |
        $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME -ne 'master') {
          $env:GITHUB_REF_NAME
        } else {
          "${{ github.event.inputs.tag }}"
        }
        $ver = $tag -replace '^v', ''
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
        echo "ver=$ver" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Build installer
      working-directory: Windows/installer
      run: |
        $ver = "${{ steps.version.outputs.ver }}"
        & "C:\Program Files (x86)\NSIS\Bin\makensis.exe" /DPRODUCT_VERSION=$ver ProxyBridge.nsi
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Move-Item "ProxyBridge-XRay-Setup-$ver.exe" "..\output\" -Force
      shell: pwsh

    - name: Package portable ZIP
      working-directory: Windows
      run: |
        $tag = "${{ steps.version.outputs.tag }}"
        $zipName = "ProxyBridge-XRay-$tag-win-x64-portable.zip"
        # Zip everything except the installer itself
        $files = Get-ChildItem output\* | Where-Object { $_.Name -notlike "*Setup*" }
        Compress-Archive -Path $files.FullName -DestinationPath $zipName -Force
        Write-Host "Created: $zipName"
      shell: pwsh

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Windows/output/ProxyBridge-XRay-Setup-*.exe
          Windows/ProxyBridge-XRay-*-portable.zip
        tag_name: ${{ steps.version.outputs.tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ProxyBridge-XRay-${{ steps.version.outputs.tag }}-win-x64
        path: Windows/output/
        retention-days: 30
